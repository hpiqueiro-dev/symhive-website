<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img" aria-labelledby="title desc">
  <title id="title">Leitura de operação</title><desc id="desc">Gráfico de simulação com trajetórias animadas, nós e indicadores esquemáticos.</desc>
  <style>
    .trace{stroke-dasharray:1300;stroke-dashoffset:1300;animation:draw 2.8s ease forwards}.trace.alt{animation-delay:.35s}.node{animation:blink 3s ease-in-out infinite}.node.b{animation-delay:1s}.scan{animation:scan 8s linear infinite}
    @keyframes draw{to{stroke-dashoffset:0}}@keyframes blink{50%{opacity:.35}}@keyframes scan{from{transform:translateY(0)}to{transform:translateY(530px)}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}.trace{stroke-dashoffset:0}}
  </style>
